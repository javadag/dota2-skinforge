appId: com.joad.dota2skinforge
productName: Dota 2 SkinForge
copyright: Copyright © 2026 Joad

directories:
  output: dist
  buildResources: assets

files:
  - out/**/*
  - package.json

extraResources:
  - from: data
    to: data
    filter:
      - '**/*'
      - '!itemStyles.json'
  - from: assets
    to: assets
    filter:
      - icon.ico
      - icon-pack.tar.br
      - icon-pack.json
      - ability-icons.tar.br
      - ability-icons.json
  - from: .cache/wearable-merger
    to: tools
    filter:
      - wearable-merger.exe

win:
  icon: assets/icon.ico
  target:
    - target: portable
      arch:
        - x64
  artifactName: Dota2SkinForge-Portable.exe

portable:
  artifactName: Dota2SkinForge-Portable.exe
  requestExecutionLevel: user

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Dota 2 SkinForge
  artifactName: Dota2SkinForge-Setup-v${version}.${ext}
