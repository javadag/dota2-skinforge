<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 144" width="256" height="144">
  <defs>
    <linearGradient id="c_bg_interface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d2e"/>
      <stop offset="50%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <radialGradient id="c_glow_interface" cx="50%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c_border_interface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3)"/>
    </linearGradient>
    <filter id="c_shadow_interface" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="144" rx="8" fill="url(#c_bg_interface)"/>
  <rect width="256" height="144" rx="8" fill="url(#c_glow_interface)"/>

  <!-- Subtle Runic Backdrop Rings -->
  <ellipse cx="128" cy="56" rx="60" ry="34" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-dasharray="4,4"/>
  <ellipse cx="128" cy="56" rx="42" ry="24" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-dasharray="3,3"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="254" height="142" rx="7.5" fill="none" stroke="url(#c_border_interface)" stroke-width="1.2"/>
  <rect x="5" y="5" width="246" height="134" rx="5.5" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.8"/>

  <!-- Corner Brackets -->
  <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity="0.6"/>
  <path d="M 248 16 L 248 8 L 240 8" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity="0.6"/>
  <path d="M 8 128 L 8 136 L 16 136" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity="0.6"/>
  <path d="M 248 128 L 248 136 L 240 136" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity="0.6"/>

  <!-- Centered Icon (Centered at 128, 56) -->
  <g transform="translate(128, 56) scale(1.3)" filter="url(#c_shadow_interface)">
    
    <g>
      <!-- Armory Console Bracket -->
      <path d="M-18 -12 L18 -12 L18 -6 L10 2 L-10 2 L-18 -6 Z" fill="#1e293b" stroke="#64748b" stroke-width="1.6"/>
      <rect x="-14" y="6" width="28" height="10" rx="2" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
      <!-- Health / Mana Bar Lines -->
      <line x1="-10" y1="9" x2="10" y2="9" stroke="#22c55e" stroke-width="1.5"/>
      <line x1="-10" y1="13" x2="6" y2="13" stroke="#3b82f6" stroke-width="1.5"/>
    </g>
  
  </g>

  <!-- Category Title Badge -->
  <text x="128" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#e2e8f0" letter-spacing="1.5">INTERFACE & HUD</text>
  <rect x="108" y="129" width="40" height="2" rx="1" fill="#38bdf8" opacity="0.85"/>
</svg>